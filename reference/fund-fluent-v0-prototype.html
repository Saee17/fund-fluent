<title>Fund Fluent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column app — a zigzag lesson path, full-screen lessons that alternate idea cards and quick checks, bottom tab bar. Indigo for action, marigold (the ₹200 note) for rewards and examples. */
:root{
  --bg:#F2F3F9; --surface:#FFFFFF; --sunk:#E8EAF4; --ink:#17193B; --muted:#5C6082; --line:#D8DBEA;
  --brand:#3D3FD8; --brand-deep:#2A2BA6; --brand-tint:#E7E8FF; --on-brand:#FFFFFF;
  --gold:#F2B705; --gold-deep:#C48F00; --gold-tint:#FFF3CC; --on-gold:#3A2C00; --gold-text:#8A6400;
  --good:#17894D; --good-deep:#0F6A3A; --good-bg:#DFF4E7; --bad:#C93A32; --bad-deep:#9E2A24; --bad-bg:#FCE6E4;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11122A; --surface:#1A1C3A; --sunk:#232651; --ink:#ECEDF9; --muted:#A4A7C9; --line:#30335C;
  --brand:#8486FF; --brand-deep:#5C5EE0; --brand-tint:#272A62; --on-brand:#0E0F26;
  --gold:#F5C33B; --gold-deep:#B88A0E; --gold-tint:#3A3216; --on-gold:#241A00; --gold-text:#F5C33B;
  --good:#4CC583; --good-deep:#2E9A5F; --good-bg:#16352A; --bad:#FF7A70; --bad-deep:#C9524A; --bad-bg:#3D1F27;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11122A; --surface:#1A1C3A; --sunk:#232651; --ink:#ECEDF9; --muted:#A4A7C9; --line:#30335C;
  --brand:#8486FF; --brand-deep:#5C5EE0; --brand-tint:#272A62; --on-brand:#0E0F26;
  --gold:#F5C33B; --gold-deep:#B88A0E; --gold-tint:#3A3216; --on-gold:#241A00; --gold-text:#F5C33B;
  --good:#4CC583; --good-deep:#2E9A5F; --good-bg:#16352A; --bad:#FF7A70; --bad-deep:#C9524A; --bad-bg:#3D1F27;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 112px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px;border-bottom:2px solid var(--line)}
.brandname{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;margin-right:auto}
.stat{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-weight:700;font-size:15px}
.stat svg{flex:none}
.ring{--p:0;width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center}
.ring::after{content:"";width:20px;height:20px;border-radius:50%;background:var(--bg)}

.intro{margin-top:20px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px 18px}
.intro h1{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.15;margin:0 0 6px;text-wrap:balance}
.intro p{margin:0;color:var(--muted);max-width:60ch}
.steps-legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--brand-tint);color:var(--brand)}
.pill.q{background:var(--gold-tint);color:var(--gold-text)}

.unit{margin-top:28px}
.unit-band{background:var(--brand);color:var(--on-brand);border-radius:16px;padding:14px 18px;display:flex;gap:12px;align-items:center;border-bottom:4px solid var(--brand-deep)}
.unit-band.warm{background:var(--gold);color:var(--on-gold);border-bottom-color:var(--gold-deep)}
.unit-band.locked{background:var(--sunk);color:var(--muted);border-bottom-color:var(--line)}
.unit-band .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.unit-band h2{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.15;margin:2px 0 0;text-wrap:balance}
.unit-band .count{margin-left:auto;font-family:var(--f-mono);font-weight:700;font-size:14px;white-space:nowrap}
.nodes{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:24px 4px}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:200px;text-align:center}
.node{width:76px;height:70px;border-radius:50%;border:none;cursor:pointer;font-family:var(--f-mono);font-weight:700;font-size:15px;display:grid;place-items:center;
  background:var(--sunk);color:var(--muted);box-shadow:0 6px 0 var(--line);transition:transform .12s}
.node:disabled{cursor:not-allowed}
.node:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.node.done{background:var(--gold);color:var(--on-gold);box-shadow:0 6px 0 var(--gold-deep)}
.node.done:active{box-shadow:0 2px 0 var(--gold-deep)}
.node.current{background:var(--brand);color:var(--on-brand);box-shadow:0 6px 0 var(--brand-deep);outline:4px solid var(--brand-tint);outline-offset:6px}
.node.current:active{box-shadow:0 2px 0 var(--brand-deep)}
.node-label{font-size:13px;color:var(--muted);font-weight:600;line-height:1.3}
.node-label.on{color:var(--ink)}
.start-tip{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-weight:700;font-size:13px;color:var(--brand);letter-spacing:.04em;text-transform:uppercase}

.btn{appearance:none;border:none;border-radius:14px;padding:14px 20px;font-weight:700;font-size:16px;letter-spacing:.02em;cursor:pointer;
  background:var(--brand);color:var(--on-brand);box-shadow:0 4px 0 var(--brand-deep);transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--brand-deep)}
.btn:disabled{background:var(--sunk);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.good{background:var(--good);color:#fff;box-shadow:0 4px 0 var(--good-deep)}
.btn.bad{background:var(--bad);color:#fff;box-shadow:0 4px 0 var(--bad-deep)}
.btn.wide{width:100%}
.btn.small{padding:8px 14px;font-size:14px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);display:flex;justify-content:center;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs-inner{display:flex;gap:8px;width:100%;max-width:560px}
.tab{flex:1;border:2px solid transparent;background:none;border-radius:12px;padding:10px 6px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--brand);border-color:var(--brand-tint);background:var(--brand-tint)}

.section-h{font-family:var(--f-display);font-weight:800;font-size:24px;margin:24px 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.tile{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:center;margin-bottom:12px}
.tile h3{margin:0;font-size:17px}
.tile p{margin:2px 0 0;color:var(--muted);font-size:14px}
.tile .btn{margin-left:auto;flex:none;padding:10px 16px}
.tile-body{min-width:0}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.statbox{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px}
.statbox b{display:block;font-family:var(--f-mono);font-size:22px}
.statbox span{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}

/* flashcards */
.fcard{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:22px;min-height:280px;cursor:pointer;display:flex;flex-direction:column;gap:14px}
.fcard.back{background:var(--brand-tint);border-color:var(--brand)}
.fcard .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fcard .term{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.1;text-wrap:balance;margin-top:auto}
.fcard .tap{margin-top:auto;font-size:14px;color:var(--muted)}
.fsec .lbl{color:var(--brand)}
.fsec p{margin:2px 0 0;font-size:17px;line-height:1.5}
.fsec.like .lbl{color:var(--gold-text)}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.card-meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:14px;gap:12px;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
.navbtns{display:flex;gap:8px}

/* lesson */
.lesson{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lesson-head{display:flex;align-items:center;gap:14px;padding:14px 16px;max-width:620px;width:100%;margin:0 auto}
.x{background:none;border:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:8px;display:grid}
.bar{flex:1;height:16px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .35s ease;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.combo{font-family:var(--f-mono);font-weight:700;color:var(--gold-text);font-size:14px;min-width:44px;text-align:right}
.lesson-body{flex:1;overflow-y:auto;padding:12px 16px 24px}
.lesson-inner{max-width:620px;margin:0 auto}
.qtype{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.qtype.q{color:var(--gold-text)}
.qtext{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.2;margin:6px 0 20px;text-wrap:balance}
.again{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-text);background:var(--gold-tint);padding:2px 8px;border-radius:6px}
.resume{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--gold-tint);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.resume span{flex:1 1 180px}

.teach{display:flex;flex-direction:column;gap:14px}
.teach h2{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.1;margin:4px 0 0;text-wrap:balance}
.teach p{margin:0;font-size:17px;line-height:1.6;max-width:62ch}
.teach p b{font-weight:700;color:var(--brand)}
.example{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.example .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-text);margin-bottom:8px}
.ex-row{display:flex;justify-content:space-between;gap:12px;padding-block:6px;border-bottom:1px dashed var(--line);font-size:15px}
.ex-row:last-child{border-bottom:none}
.ex-row span:last-child{font-family:var(--f-mono);font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ex-note{font-size:15px;padding-block:4px}
.inapp{font-size:15px;color:var(--muted);border-left:3px solid var(--brand);padding:2px 0 2px 12px}
.inapp b{color:var(--ink)}

/* maths pictures */
.viz{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.viz .cap{font-size:14px;color:var(--muted);font-weight:600}
.grid100{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:240px}
.grid100 i{aspect-ratio:1;border-radius:3px;background:var(--sunk)}
.grid100 i.on{background:var(--gold)}
.shares{display:flex;gap:10px;flex-wrap:wrap}
.share{border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:4px;max-width:110px;align-content:flex-start}
.share b{display:block;width:100%;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.coin{width:20px;height:20px;border-radius:50%;background:var(--gold);box-shadow:inset 0 -2px 0 var(--gold-deep);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--on-gold)}
.blocks{display:flex;flex-direction:column;gap:6px}
.blk{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:14px}
.blk span:first-child{width:52px;font-weight:700;color:var(--brand)}
.blk i{height:14px;border-radius:4px;background:var(--gold);display:block}
.blk em{font-style:normal;color:var(--muted)}

.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;font-size:16px;font-weight:500}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint)}
.opt[aria-pressed="true"] .k{border-color:var(--brand);color:var(--brand)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-weight:700;font-size:18px;padding:22px}

.numrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:6px 16px}
.numrow span{font-family:var(--f-mono);font-weight:700;color:var(--muted);font-size:20px}
.numrow input{flex:1;min-width:0;border:none;background:none;font-family:var(--f-mono);font-size:26px;font-weight:700;color:var(--ink);padding:10px 0}
.numrow input:focus-visible{outline:none}
.numrow:focus-within{border-color:var(--brand)}
.numtools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.hintline{font-size:14px;color:var(--muted)}
.work{margin-top:14px;background:var(--gold-tint);border-radius:14px;padding:12px 16px}
.work .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-text);margin-bottom:6px}
.work ol{margin:0;padding-left:22px}
.work li{margin:4px 0;font-family:var(--f-mono);font-size:14px;line-height:1.5}

.slot{min-height:64px;border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.slot:empty::before{content:"Tap items below in order";color:var(--muted);font-size:14px;padding:8px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600;font-size:15px;text-align:left}
.chip .n{font-family:var(--f-mono);color:var(--brand);margin-right:8px}
.chip.used{visibility:hidden}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start;min-width:0}
.mitem{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:12px;cursor:pointer;font-size:15px;font-weight:600;text-align:left;min-height:56px}
.mitem.left{font-family:var(--f-display);font-weight:800;font-size:16px}
.mitem[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint)}
.mitem.ok{border-color:var(--good);background:var(--good-bg);color:var(--good);cursor:default;opacity:.75}
.mitem.miss{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.foot{border-top:2px solid var(--line);background:var(--bg);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.foot-inner{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:12px;max-height:55vh;overflow-y:auto}
.foot-row{display:flex;gap:10px;align-items:center}
.foot-row .btn{flex:1}
.foot.good{background:var(--good-bg);border-color:transparent}
.foot.bad{background:var(--bad-bg);border-color:transparent}
.fb-title{font-family:var(--f-display);font-weight:800;font-size:22px}
.foot.good .fb-title{color:var(--good)}
.foot.bad .fb-title{color:var(--bad)}
.fb-answer{font-weight:700}
.fb-why{color:var(--ink);font-size:15px;max-width:65ch}
.fb-note{color:var(--muted);font-size:14px}
.foot .work{background:var(--surface);margin-top:0}

.done-screen{text-align:center;padding-top:24px}
.done-screen h2{font-family:var(--f-display);font-weight:800;font-size:32px;margin:12px 0 6px;text-wrap:balance}
.done-screen p{color:var(--muted);margin:0 auto 20px;max-width:40ch}
.medal{width:96px;height:96px;margin:0 auto;border-radius:50%;background:var(--gold);box-shadow:0 8px 0 var(--gold-deep);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:22px;color:var(--on-gold)}
.done-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto}
.done-stats div{border:2px solid var(--line);border-radius:14px;padding:10px 6px;background:var(--surface)}
.done-stats b{display:block;font-family:var(--f-mono);font-size:22px}
.done-stats span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.learned{max-width:420px;margin:20px auto 0;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.learned .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.learned li{margin:4px 0}

.confirm{margin-top:12px;padding:14px;border-radius:14px;background:var(--surface);border:2px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.confirm p{margin:0;flex:1 1 200px;font-weight:600}

@media (max-width:420px){
  .qtext{font-size:21px}.teach h2{font-size:26px}.teach p{font-size:16px}
  .unit-band h2{font-size:19px}.fcard .term{font-size:28px}
  .match{gap:8px}.mitem{font-size:14px;padding:10px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brandname">Fund Fluent</div>
    <div class="stat" title="Day streak">
      <svg width="20" height="22" viewBox="0 0 20 22" aria-hidden="true"><path d="M10 1c1 4 6 6 6 12a6 6 0 1 1-12 0c0-3 2-4 2-7 2 1 3 3 3 5 1-2 1-6 1-10z" fill="var(--gold)"/></svg>
      <span id="streak">0</span>
    </div>
    <div class="stat" title="Total XP">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M11 1 3 12h6l-1 7 8-11h-6z" fill="var(--brand)"/></svg>
      <span id="xp">0</span>
    </div>
    <div class="stat" title="Today's goal: 30 XP"><div class="ring" id="ring"></div></div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-inner" role="tablist">
    <button class="tab" role="tab" id="tab-learn" data-tab="learn" aria-selected="true">Learn</button>
    <button class="tab" role="tab" id="tab-practice" data-tab="practice" aria-selected="false">Practice</button>
    <button class="tab" role="tab" id="tab-cards" data-tab="cards" aria-selected="false">Cards</button>
    <button class="tab" role="tab" id="tab-pct" data-tab="pct" aria-selected="false">Percent</button>
  </div>
</nav>

<div class="lesson" id="lesson" hidden></div>

<script>
/* ======================================================================
   CONTENT. Each level = a few ideas, always in the same order.
   Each idea is taught on a card, then checked only on what has been taught.
   ex rows: [label, value] or a plain string. **bold** marks key words.
   viz: a picture for the maths ideas. work: step-by-step working for number questions.
   ====================================================================== */
const UNITS = [

const dayKey=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const yest=()=>{const d=new Date();d.setDate(d.getDate()-1);return dayKey(d)};

/* ---------- helpers ---------- */
function h(tag,attrs,...kids){const el=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')el.className=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(k==='text')el.textContent=v;else el.setAttribute(k,v===true?'':v)}kids.flat().forEach(c=>{if(c==null||c===false)return;el.append(c.nodeType?c:document.createTextNode(c))});return el}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
/* fixed shuffle: the same question always shows its pieces in the same order */
function fixedShuffle(a,seed){let s=0;for(const c of seed)s=(s*31+c.charCodeAt(0))>>>0;const rnd=()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
  a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const inr=n=>Number(n).toLocaleString('en-IN');
function rich(text){const p=h('p');text.split(/(\*\*[^*]+\*\*)/).forEach(part=>{if(part.startsWith('**'))p.append(h('b',{text:part.slice(2,-2)}));else if(part)p.append(part)});return p}

/* Drill generator: random but always clean numbers, with step-by-step working */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const R=n=>'₹'+inr(n);
function pctSteps(p,A){
  const t=A/10,o=A/100;
  switch(p){
    case 1:return [`1% = knock off two zeros: ${R(A)} → ${R(o)}`];
    case 2:return [`1% of ${R(A)} = ${R(o)}`,`2% = 1% twice = ${R(o*2)}`];
    case 0.5:return [`1% of ${R(A)} = ${R(o)}`,`0.5% = half of 1% = ${R(o/2)}`];
    case 5:return [`10% of ${R(A)} = ${R(t)}`,`5% = half of 10% = ${R(t/2)}`];
    case 10:return [`10% = knock off one zero: ${R(A)} → ${R(t)}`];
    case 12.5:return [`10% of ${R(A)} = ${R(t)}`,`2.5% = a quarter of that = ${R(t/4)}`,`12.5% = ${R(t)} + ${R(t/4)} = ${R(t*1.25)}`];
    case 15:return [`10% of ${R(A)} = ${R(t)}`,`5% = half of that = ${R(t/2)}`,`15% = ${R(t)} + ${R(t/2)} = ${R(t*1.5)}`];
    case 20:return [`10% of ${R(A)} = ${R(t)}`,`20% = 10% twice = ${R(t*2)}`];
    case 25:return [`50% of ${R(A)} = half = ${R(A/2)}`,`25% = half of that = ${R(A/4)}`];
    case 50:return [`50% = half of ${R(A)} = ${R(A/2)}`];
  }
}
function genQ(i){
  const kind=pick(['of','of','move','change']);
  const amounts=[20000,40000,80000,120000,200000,400000,600000,1000000];
  const id='gen-'+Date.now()+'-'+i;
  if(kind==='of'){
    const p=pick([0.5,1,2,5,10,12.5,15,20,25,50]),A=pick(amounts),ans=A*p/100;
    let q;
    if(p<=2)q=pick([`A fund's expense ratio is ${p}%. You hold ${R(A)}. Roughly what is the yearly fee?`,`You redeem ${R(A)} and the exit load is ${p}%. What is the fee?`]);
    else if(p===12.5)q=`Long-term equity tax is 12.5%. Your taxable gain is ${R(A)}. What is the tax?`;
    else if(p===20)q=pick([`Short-term equity tax is 20%. Your gain is ${R(A)}. What is the tax?`,`Your ${R(A)} portfolio is 20% in debt funds. How much is that?`]);
    else q=pick([`Your ${R(A)} portfolio has ${p}% in small cap funds. How much is that?`,`A holding worth ${R(A)} rises ${p}%. By how many rupees did it rise?`,`The market falls ${p}%. Your equity holding was ${R(A)}. How many rupees did you lose?`]);
    return {id,gen:true,t:'num',q,a:ans,tol:0,prefix:'₹',why:`${p}% of ${R(A)} = ${R(ans)}.`,work:pctSteps(p,A)};
  }
  if(kind==='move'){
    const p=pick([5,10,15,20,25,50]),A=pick(amounts),up=Math.random()<.5,d=A*p/100,ans=up?A+d:A-d;
    const q=up?`Your ${R(A)} investment rises ${p}%. What is it worth now?`:`Your ${R(A)} investment falls ${p}%. What is it worth now?`;
    return {id,gen:true,t:'num',q,a:ans,tol:0,prefix:'₹',why:`${p}% of ${R(A)} is ${R(d)}, so ${R(ans)}.`,work:[...pctSteps(p,A),up?`It rose, so add: ${R(A)} + ${R(d)} = ${R(ans)}`:`It fell, so take away: ${R(A)} − ${R(d)} = ${R(ans)}`]};
  }
  const p=pick([5,10,20,25,50]),A=pick([200,400,800,1000,2000,40000,80000,200000]),up=Math.random()<.6,d=A*p/100,B=up?A+d:A-d,t=A/10;
  const q=pick([`A fund's NAV moved from ${R(A)} to ${R(B)}. By what % did it ${up?'rise':'fall'}?`,`Your holding went from ${R(A)} to ${R(B)}. By what % did it ${up?'rise':'fall'}?`]);
  return {id,gen:true,t:'num',q,a:p,tol:0,suffix:'%',why:`The change of ${R(d)} is ${p}% of ${R(A)}.`,
    work:[`Change = ${up?R(B)+' − '+R(A):R(A)+' − '+R(B)} = ${R(d)}`,`10% of ${R(A)} = ${R(t)}`,`${R(d)} ÷ ${R(t)} = ${d/t}`,`${d/t} × 10% = ${p}%`]};
}

/* ---------- lesson engine: fixed sequence of idea cards and questions ---------- */
let L=null;
function startLesson(cfg){
  let steps=[];let resumedFrom=0;
  if(cfg.mode==='level'){
    const lv=cfg.level;
    if(!cfg.fromStart&&S.resume&&S.resume.lv===lv.id&&S.resume.idea>0&&S.resume.idea<lv.ideas.length)resumedFrom=S.resume.idea;
    lv.ideas.forEach((idea,i)=>{if(i<resumedFrom)return;steps.push({kind:'teach',idea,n:i+1,of:lv.ideas.length});idea.qs.forEach(q=>steps.push({kind:'q',q,retry:false}))});
  }else{
    let pool;
    if(cfg.mode==='drill')pool=Array.from({length:10},(_,i)=>genQ(i));
    else if(cfg.mode==='mistakes')pool=S.mistakes.map(id=>ALLQ[id]).filter(Boolean);
    else if(cfg.mode==='numbers')pool=learnedQs().filter(q=>q.t==='num');
    else pool=learnedQs();
    steps=shuffle(pool).slice(0,10).map(q=>({kind:'q',q,retry:false}));
  }
  if(!steps.length)return;
  L={cfg,resumedFrom,queue:steps,total:steps.length,cleared:0,qCount:steps.filter(s=>s.kind==='q').length,xp:0,firstRight:0,combo:0,retries:{},start:Date.now(),cur:null,phase:'teach'};
  document.getElementById('lesson').hidden=false;document.body.style.overflow='hidden';
  nextStep();
}
function closeLesson(){L=null;document.getElementById('lesson').hidden=true;document.body.style.overflow='';render()}
function nextStep(){if(!L.queue.length)return finish();L.cur=L.queue.shift();L.answer=null;L.hinted=false;
  if(L.cur.kind==='teach'){L.phase='teach';if(L.cfg.mode==='level'){S.resume={lv:L.cfg.level.id,idea:L.cur.n-1};save()}drawTeach()}else{L.phase='answer';drawQ()}}

const TYPE_LABEL={mcq:'Choose the answer',tf:'True or false',num:'Work it out',order:'Put in order',match:'Match the pairs'};

function drawQ(){

const setReady=ok=>{L.checkBtn.disabled=!ok};

const BUILD={
  mcq(q){return choice(q.opts,'opts')},
  tf(){return choice(['True','False'],'opts tf')},
  num(q){
    const inp=h('input',{id:'num-answer',inputmode:'decimal',autocomplete:'off','aria-label':'Your answer',placeholder:'0'});
    inp.addEventListener('input',()=>{L.answer=inp.value;setReady(inp.value.trim()!=='')});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!L.checkBtn.disabled){e.preventDefault();check()}});
    const holder=h('div');
    const help=q.work?h('button',{class:'btn ghost small',onclick:()=>{L.hinted=true;help.remove();holder.append(workBox(q))}},'Show me how'):null;
    return h('div',null,h('div',{class:'numrow'},q.prefix?h('span',{text:q.prefix}):null,inp,q.suffix?h('span',{text:q.suffix}):null),
      h('div',{class:'numtools'},h('span',{class:'hintline',text:'Numbers only. Commas are fine.'}),help),holder);
  },
  order(q){
    let mix=fixedShuffle(q.items,q.id);if(mix.join()===q.items.join())mix=mix.slice().reverse();
    L.answer=[];const slot=h('div',{class:'slot','aria-label':'Your order'}),pool=h('div',{class:'pool'});
    const redraw=()=>{slot.replaceChildren(...L.answer.map((it,i)=>h('button',{class:'chip',onclick:()=>{if(L.phase!=='answer')return;L.answer.splice(i,1);redraw()}},h('span',{class:'n',text:i+1}),it)));
      pool.querySelectorAll('.chip').forEach(c=>c.classList.toggle('used',L.answer.includes(c.dataset.v)));setReady(L.answer.length===q.items.length)};
    mix.forEach(it=>pool.append(h('button',{class:'chip','data-v':it,onclick:()=>{if(L.phase!=='answer'||L.answer.includes(it))return;L.answer.push(it);redraw()}},it)));
    redraw();return h('div',null,slot,pool);
  },
  match(q){
    let sel=null,slips=0,left=q.pairs.length;const all=[];
    const lc=h('div',{class:'col'}),rc=h('div',{class:'col'});
    const pick=(btn,side,key)=>{
      if(btn.classList.contains('ok')||L.phase!=='answer')return;
      if(!sel||sel.side===side){all.forEach(b=>b.setAttribute('aria-pressed','false'));sel={btn,side,key};btn.setAttribute('aria-pressed','true');return}

      else{slips++;const a=sel.btn;[a,btn].forEach(b=>{b.classList.add('miss');b.setAttribute('aria-pressed','false')});setTimeout(()=>[a,btn].forEach(b=>b.classList.remove('miss')),450);sel=null}

};
function choice(opts,cls){
  const box=h('div',{class:cls});
  opts.forEach((o,i)=>{const b=h('button',{class:'opt','aria-pressed':'false','data-i':i},h('span',{class:'k',text:i+1}),h('span',{text:o}));
    b.onclick=()=>{if(L.phase!=='answer')return;box.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b));L.answer=i;setReady(true)};box.append(b)});
  return box;
}

function isRight(q,a){
  if(q.t==='mcq')return a===q.a;
  if(q.t==='tf')return (a===0)===q.a;
  if(q.t==='num'){const v=parseFloat(String(a).replace(/[₹,%\s]/g,''));return !isNaN(v)&&Math.abs(v-q.a)<=q.tol}
  if(q.t==='order')return a.join('|')===q.items.join('|');
  if(q.t==='match')return a===0;
}
function answerText(q){
  if(q.t==='mcq')return q.opts[q.a];
  if(q.t==='tf')return q.a?'True':'False';
  if(q.t==='num')return (q.prefix||'')+inr(q.a)+(q.suffix?' '+q.suffix:'');
  if(q.t==='order')return q.items.join(' → ');
  return '';
}
const PRAISE=['Nice.','Spot on.','Correct.','Exactly.','That\'s it.'];

function check(){
  if(L.phase!=='answer')return;
  const {q,retry}=L.cur,ok=isRight(q,L.answer);L.phase='feedback';
  S.answered++;if(ok)S.correct++;
  if(q.t==='mcq'||q.t==='tf')document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const i=+b.dataset.i,c=q.t==='mcq'?i===q.a:(i===0)===q.a;if(c)b.classList.add('right');else if(i===L.answer)b.classList.add('wrong')});
  document.querySelectorAll('.chip').forEach(c=>c.disabled=true);
  const inp=document.getElementById('num-answer');if(inp)inp.disabled=true;
  let requeued=false;
  if(ok){
    L.cleared++;L.combo++;const gain=(retry||L.hinted)?5:10;L.xp+=gain;if(!retry&&!L.hinted)L.firstRight++;
    if(L.cfg.mode==='mistakes'||retry)S.mistakes=S.mistakes.filter(x=>x!==q.id);
  }else{
    L.combo=0;if(!q.gen&&!S.mistakes.includes(q.id))S.mistakes.push(q.id);
    const n=L.retries[q.id]=(L.retries[q.id]||0)+1;
    if(n<=2){L.queue.push({kind:'q',q,retry:true});requeued=true}else L.cleared++;
  }
  save();
  const foot=document.getElementById('foot');foot.className='foot '+(ok?'good':'bad');
  let title=ok?PRAISE[Math.floor(Math.random()*PRAISE.length)]:'Not quite.';
  if(q.t==='match'&&!ok)title=`Matched, with ${L.answer} wrong tap${L.answer>1?'s':''}.`;
  const cont=h('button',{class:'btn wide '+(ok?'good':'bad'),id:'continue',onclick:nextStep},'Continue');
  foot.replaceChildren(h('div',{class:'foot-inner',role:'status'},
    h('div',{class:'fb-title',text:title}),
    (!ok&&q.t!=='match')?h('div',{class:'fb-answer',text:'Answer: '+answerText(q)}):null,
    (!ok&&q.work&&!L.hinted)?workBox(q):h('div',{class:'fb-why',text:q.why}),
    requeued?h('div',{class:'fb-note',text:'This one will come back at the end of the lesson.'}):null,
    cont));
  document.querySelector('.bar i').style.width=Math.round(L.cleared/L.total*100)+'%';
  document.querySelector('.combo').textContent=L.combo>=3?`×${L.combo}`:'';
  setTimeout(()=>cont.focus(),30);
}

function finish(){
  const perfect=L.qCount>0&&L.firstRight===L.qCount;if(perfect)L.xp+=20;
  S.xp+=L.xp;const today=dayKey();
  if(S.lastDay!==today){S.streak=S.lastDay===yest()?S.streak+1:1;S.lastDay=today}
  if(S.todayDate!==today){S.todayDate=today;S.todayXp=0}
  S.todayXp+=L.xp;S.lessons++;
  const lv=L.cfg.level;
  if(lv){if(!S.done.includes(lv.id))S.done.push(lv.id);if(S.resume&&S.resume.lv===lv.id)S.resume=null}
  save();
  const secs=Math.round((Date.now()-L.start)/1000),acc=L.qCount?Math.round(L.firstRight/L.qCount*100):0;
  const nl=nextLevel(),newCards=lv?CARDS.filter(c=>c.lv===lv.id).length:0;
  const nextPct=lv&&lv.pct?PCT.levels.find(x=>!isDone(x)):null;
  let sub=lv&&lv.pct?(nextPct?`Next percent lesson: ${nextPct.name}.`:'All percent lessons done. Try the quick drill.'):lv?(nl?`Next up: ${nl.name} (${nl.unit.label}).`:'You have finished every level.'):L.cfg.mode==='drill'?'Drill complete. Every run gives you new sums.':L.cfg.mode==='mistakes'?`${S.mistakes.length} mistake${S.mistakes.length===1?'':'s'} left in your deck.`:'Review complete.';
  if(newCards)sub+=` ${newCards} new flashcard${newCards>1?'s':''} unlocked.`;
  const done=h('button',{class:'btn wide',onclick:closeLesson},'Continue');
  document.getElementById('lesson').replaceChildren(h('div',{class:'lesson-body'},h('div',{class:'lesson-inner done-screen'},
    h('div',{class:'medal',text:'+'+L.xp}),
    h('h2',{text:perfect?'Perfect lesson':'Lesson complete'}),
    h('p',{text:sub+(perfect?' Bonus 20 XP for no mistakes.':'')}),
    h('div',{class:'done-stats'},
      h('div',null,h('b',{text:L.xp}),h('span',{text:'XP'})),
      h('div',null,h('b',{text:acc+'%'}),h('span',{text:'First try'})),
      h('div',null,h('b',{text:(secs>=60?Math.floor(secs/60)+'m ':'')+(secs%60)+'s'}),h('span',{text:'Time'}))),
    lv?h('div',{class:'learned'},h('div',{class:'lbl',text:'You learned'}),h('ul',null,lv.ideas.map(i=>h('li',{text:i.title})))):null)),
    h('div',{class:'foot'},h('div',{class:'foot-inner'},done)));
  L.phase='done';renderTop();setTimeout(()=>done.focus(),30);
}

function quitAsk(){
  const foot=document.querySelector('#lesson .foot');if(!foot)return closeLesson();
  const prev=[...foot.childNodes],prevClass=foot.className;foot.className='foot';
  const msg=L.cfg.mode==='level'?`You\'ll come back to idea ${(S.resume?.idea??0)+1} of this lesson. XP from this session won\'t be saved.`:'XP from this session won\'t be saved. Missed questions stay in Practice.';
  foot.replaceChildren(h('div',{class:'foot-inner'},h('div',{class:'fb-title',text:'Leave this lesson?'}),h('div',{class:'fb-why',text:msg}),
    h('div',{class:'card-actions'},h('button',{class:'btn ghost',onclick:()=>{foot.className=prevClass;foot.replaceChildren(...prev)}},'Keep going'),h('button',{class:'btn bad',onclick:closeLesson},'Leave'))));
}

document.addEventListener('keydown',e=>{
  if(!L||document.getElementById('lesson').hidden||e.target.tagName==='INPUT')return;
  if(L.phase==='answer'&&/^[1-9]$/.test(e.key)){const b=document.querySelector(`.opt[data-i="${+e.key-1}"]`);if(b)b.click()}
  if(e.key==='Enter'&&document.activeElement?.tagName!=='BUTTON'){
    if(L.phase==='answer'&&!L.checkBtn.disabled&&!L.checkBtn.hidden){e.preventDefault();check()}
    else if(L.phase==='feedback'||L.phase==='teach'){e.preventDefault();document.getElementById('continue')?.click()}
  }
});

render();
</script>
